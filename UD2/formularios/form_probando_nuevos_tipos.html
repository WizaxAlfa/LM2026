<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="Formularios" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form method="get" action="validar.php">
        <fieldset>
            <legend>Datos Personales</legend>
            <label for="Telefono">Telefono</label>
            <input type="text" id="Telefono" name="Telefono" placeholder="9 numeros" maxlength="9"><br>
            <label for="mail">Email</label>
            <input type="email" id="mail" name="mail" placeholder="El formato correcto es nombre+@+servidor de correo" maxlength="50" autocomplete="on">
        </fieldset>
        <fieldset>
            <legend>Valores Numericos</legend>
            <label for="Npersonas">Número de personas</label>
            <input type="number" id="Npersonas" name="Npersonas" min="1" max="20" step="1" value="1">
        </fieldset>
        <fieldset>
            <legend>Url y búsqueda</legend>
            <label for="buscar">Url del sitio</label>
            <input type="search" name="url" id="url">
            <label for="buscar">¿Que te interesa buscar?</label>
            <input type="text" name="buscar" id="buscar">
        </fieldset>
        <fieldset>
            <legend>Otros tipos</legend>
            <label for="color">Color</label>
            <input type="color" id="color" name="color">
        </fieldset>
        <fieldset>
            <label for="">Solucione un  día (Hasta fin de año)</label>
            <label for="">Solucione una hora</label>
            <label for="">Solucione un mes (hasta junio del 20202)</label>
            <label for="">Solucione una semana </label>
            <label for="">Solucione fecha y hora </label>
        </fieldset>
        <input type="submit" value="Entrar">
        <input type="reset" value="Limpiar">
    </form>
</body>
</html>
